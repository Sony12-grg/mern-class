<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css</title>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        padding: 10px;
      }

      .bx {
/* 
        background: linear-gradient(to top, red, green, purple); */
        background: #020024;
background: linear-gradient(90deg, rgba(2, 0, 36, 1) 0%, rgba(9, 33, 121, 1) 77%, rgba(0, 212, 255, 1) 100%);
        height: 500px;
        width: 700px;
        border: 1px solid black;

        padding: 50px;
      }

      .c-bx {
        backdrop-filter: blur(60px);
      }
    </style>



  </head>

  <body>



    <div class="bx">

      <div class="c-bx">
        <h1>hello jee</h1>
      </div>


    </div>











  </body>

</html>
