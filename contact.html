<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
</head>
<body>
    <h1>Student Information</h1>
    <!--Action: it is the URL where the form data will be sent i.e it will move to google page-->
    <form action="mailto:soniyagurung924@gmail.com" method="post" enctype="text/plain">
        <p>
          <label for="Firstname">Firstname</label>
          <input type="text" id="Firstname" name="firstname" placeholder="Enter your firstname" required>
          <!--  <input type="text" id="q" name="firstname"-->
          <!--q: query parameter for Google search which open google after this q form would submit-->
        </p>
        <p>
            <label for="Lastname">Lastname</label>
            <input type="text" id="Lastname" name="lastname" placeholder="Enter your lastname">
        </p>
        <p></p>
            <label for="Email">Email</label>
            <input type="email" id="Email" name="email" placeholder="example@gmail.com" required>
        </p>
        <p>
            <!--radio:Only one radio button in a group can be selected at the same time.-->
            <!--name must be same to be treated as same radio group-->
            <h4>Select Your Gender</h4>
            <label for="male">Male</label>
            <input type="radio" name="gender" id="male" value="male">
            <label for="female">Female</label>
            <input type="radio" name="gender" id="female" value="female">
        </p>
        <p>
            <!--checkbox-->
            <h4>Select your Habits</h4>
            <label for="reading">Reading</label>
            <input type="checkbox" name="habits" id="reading" value="reading">
            <label for="coding">Coding</label>
            <input type="checkbox" name="habits" id="coding" value="coding">
            <label for="travelling">Travelling</label>
            <input type="checkbox" name="habits" id="travelling" value="travelling">
        </p>
        <p>
            <label for="date">Date of Joining</label>
            <input type="date" id="date" name="date">
        </p>
        <p>
            <label for="country">Select your country</label>
            <select name="country" id="country">
                <option value="india">India</option>
                <option value="usa">USA</option>
                <option value="uk">UK</option>
                <option value="australia">Australia</option>
            </select>
        </p>

        <p>
            <textarea name="message" id="msg" placeholder="Write Something!" rows="15" cols="30"></textarea>
        </p>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
