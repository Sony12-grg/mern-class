<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object</title>
    <style>
      div{  
        width: 300px;
        height: 500px;
        background-color: red;
        /* transition: all 1s cubic-bezier(0.075, 0.82, 0.165, 1) 0s;
      } */
      div:hover{
        width: 500px;
        height: 300px;
        background-color: yellow;
        /* transform: rotate(80deg); */
      }
      img{
        width: 100%;
        height: 350px;
        object-fit: cover;
        filter: saturate(50%);
      }
      img:hover{
        transform: scaleY(2);
      }
    </style>
</head>
<body>
    <div>
    <img src="https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?q=80&w=1176&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
    </div>
</body>
</html>
