<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography</title>
   <style>
@import url('https://fonts.googleapis.com/css2?family=BBH+Bartle&family=Roboto:ital,wght@0,100..900;1,100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Varela+Round&display=swap');
</style>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            padding: 10px;
        }
        p{
            text-decoration:underline 1px red;
            text-underline-offset: 12px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-indent: 2px;
            text-shadow: 2px 2px 10px blue;
            color: rgb(20, 100, 80, 0.8);
            font-weight: 300;
            font-family: "Ubuntu", sans-serif;
        }
        span{
            font-weight: 500;
            font-family: "Varela Round", sans-serif;
        }
    </style>
</head>
<body>

    <p>Lorem ipsum dolor sit amet.</p>
        <span>hello</span>
</body>
</html>
